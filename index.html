<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونه کارها | نام شرکت</title>
<meta name="description" content="نمونه کارهای تبلیغات و تولید محتوا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfaf4;
    --ink: #1c1b19;
    --muted: #6f6b63;
    --line: #1c1b19;
    --soft: #e9e3d6;
    --gutter: clamp(20px, 4vw, 56px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Vazirmatn", "Manrope", sans-serif;
    font-weight: 400;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap { padding-inline: var(--gutter); max-width: 1500px; margin-inline: auto; }

  /* Header */
  header { border-bottom: 1px solid var(--line); }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-block: 18px;
  }
  .brand { font-weight: 700; font-size: 1.05rem; }
  nav { display: flex; gap: clamp(14px, 3vw, 32px); font-size: .92rem; align-items: center; }
  nav a:hover { text-decoration: underline; text-underline-offset: 6px; }
  .btn-dark {
    background: var(--ink); color: var(--paper);
    padding: 6px 18px; border-radius: 4px;
  }
  .btn-dark:hover { text-decoration: none; opacity: .85; }

  /* Hero */
  .hero { padding-block: clamp(24px, 4vw, 48px) clamp(16px, 2.5vw, 28px); border-bottom: 1px solid var(--line); }
  .hero h1 {
    direction: ltr; text-align: left;
    font-family: "Manrope", sans-serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 4.5vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    width: 100%;
  }
  .hero p {
    margin-top: clamp(20px, 3vw, 36px);
    max-width: 38rem;
    color: var(--muted);
    font-size: clamp(.98rem, 1.6vw, 1.12rem);
  }

  /* Projects */
  .project {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: clamp(20px, 4vw, 56px);
    padding-block: clamp(24px, 4vw, 40px);
    border-bottom: 1px solid var(--line);
  }
  .info { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
  .tags { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .info h2 {
    font-weight: 500;
    font-size: clamp(1.4rem, 2.6vw, 2.1rem);
    line-height: 1.35;
    margin-top: 6px;
  }
  .media {
    position: relative;
    aspect-ratio: 16 / 10;
    background: #1c1b19;
    border-radius: 6px;
    overflow: hidden;
  }
  .media img, .media video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain; display: block;
  }

  /* Contact */
  .contact { padding-block: clamp(48px, 8vw, 110px); }
  .contact h2 { font-weight: 500; font-size: clamp(1.6rem, 4vw, 3rem); line-height: 1.4; max-width: 26ch; }
  .contact ul { list-style: none; margin-top: 28px; display: grid; gap: 6px; font-size: 1rem; }
  .contact li span { color: var(--muted); margin-inline-end: 8px; }
  .contact a { border-bottom: 1px solid var(--ink); }
  footer { border-top: 1px solid var(--line); padding-block: 18px; font-size: .8rem; color: var(--muted); }


  .media { cursor: pointer; }
  .media video { pointer-events: none; }

  /* Fullscreen viewer */
  dialog#viewer {
    border: 0; padding: 0; margin: 0;
    width: 100vw; height: 100vh; max-width: none; max-height: none;
    background: #000;
  }
  dialog#viewer::backdrop { background: #000; }
  #viewerBody { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #viewerBody video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .close {
    position: fixed; top: 14px; inset-inline-start: 14px; z-index: 2;
    font: inherit; font-size: .9rem; color: #fff;
    background: rgba(0,0,0,.55); border: 1px solid #fff;
    border-radius: 4px; padding: 4px 18px; cursor: pointer;
  }

  @media (max-width: 760px) {
    .project { grid-template-columns: 1fr; }
    .info { gap: 16px; }
    nav .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top">نام شرکت</a>
    <nav>
      <a class="hide-sm" href="#work">نمونه کارها</a>
      <a class="btn-dark" href="#contact">تماس با ما</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <h1>Our branding success stories.</h1>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <!--
        ====== راهنمای ویرایش ======
        هر پروژه یک بلوک <article> است.
        برای اضافه کردن پروژه جدید، یک بلوک کامل را کپی و زیر آخرین پروژه پیست کنید.
        اسم ویدیو را در data-src عوض کنید و فایل ویدیو را کنار index.html آپلود کنید.
      -->

      <article class="project">
        <div class="info">
          <div>
            <div class="tags"><span>ویدیو</span></div>
            <h2>وینگو</h2>
          </div>
        </div>
        <div class="media" role="button" tabindex="0" aria-label="نمایش تمام صفحه">
          <video muted loop playsinline preload="none" data-src="vingo.mp4" aria-label="وینگو"></video>
        </div>
      </article>

      <article class="project">
        <div class="info">
          <div>
            <div class="tags"><span>ویدیو</span></div>
            <h2>طراحی داخلی</h2>
          </div>
        </div>
        <div class="media" role="button" tabindex="0" aria-label="نمایش تمام صفحه">
          <video muted loop playsinline preload="none" data-src="interior.mp4" aria-label="طراحی داخلی"></video>
        </div>
      </article>

      <article class="project">
        <div class="info">
          <div>
            <div class="tags"><span>ویدیو</span></div>
            <h2>پزشکی</h2>
          </div>
        </div>
        <div class="media" role="button" tabindex="0" aria-label="نمایش تمام صفحه">
          <video muted loop playsinline preload="none" data-src="medical.mp4" aria-label="پزشکی"></video>
        </div>
      </article>

      <article class="project">
        <div class="info">
          <div>
            <div class="tags"><span>ویدیو</span></div>
            <h2>باشگاه ورزشی</h2>
          </div>
        </div>
        <div class="media" role="button" tabindex="0" aria-label="نمایش تمام صفحه">
          <video muted loop playsinline preload="none" data-src="gym.mp4" aria-label="باشگاه ورزشی"></video>
        </div>
      </article>

    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2>برای ساخت ویدیو و محتوای برند خودتان با ما تماس بگیرید.</h2>
      <ul>
        <li><span>تلفن</span><a href="tel:+989120000000" dir="ltr">0912 000 0000</a></li>
        <li><span>اینستاگرام</span><a href="https://instagram.com/" dir="ltr">@your_company</a></li>
        <li><span>ایمیل</span><a href="mailto:info@example.com" dir="ltr">info@example.com</a></li>
      </ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© نام شرکت</div>
</footer>


<dialog id="viewer" aria-label="نمایش ویدیو">
  <button class="close" id="closeBtn">بستن</button>
  <div id="viewerBody"></div>
</dialog>

<script>
  const gridVideos = document.querySelectorAll('.media video');

  // Load and play each video only when it is near the screen (faster first load)
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) {
        if (!v.src) v.src = v.dataset.src;
        v.play().catch(() => {});
      } else {
        v.pause();
      }
    });
  }, { rootMargin: '200px' });
  gridVideos.forEach(v => io.observe(v));

  // Click: open fullscreen with sound
  const dlg = document.getElementById('viewer');
  const body = document.getElementById('viewerBody');

  function openViewer(src) {
    gridVideos.forEach(v => v.pause());
    body.innerHTML = '';
    const v = document.createElement('video');
    v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true;
    body.appendChild(v);
    dlg.showModal();
    v.play().catch(() => {});
  }
  function closeViewer() { if (dlg.open) dlg.close(); }

  document.querySelectorAll('.media').forEach(m => {
    const src = m.querySelector('video').dataset.src;
    m.addEventListener('click', () => openViewer(src));
    m.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(src); } });
  });
  document.getElementById('closeBtn').addEventListener('click', closeViewer);
  dlg.addEventListener('close', () => {
    body.innerHTML = '';
    gridVideos.forEach(v => { if (v.src) v.play().catch(() => {}); });
  });
</script>
</body>
</html>
